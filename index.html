<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor do Bot · Belt Correias</title>
<meta name="theme-color" content="#0c353b">
<meta name="description" content="Monitor de atividade do computador de automação da Belt Correias.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monitor do Bot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  :root{
    --bg:#eceff1;
    --surface:#ffffff;
    --surface-2:#f6f8f9;
    --ink:#16191c;
    --ink-2:#586066;
    --ink-3:#8a939a;
    --line:#dde3e6;
    --line-2:#c9d2d6;
    --bar:#0c353b;
    --brand:#0d5b63;
    --brand-2:#0a474d;
    --brand-tint:#e2efef;
    --red:#cf3a2c;
    --red-tint:#fbe6e3;
    --green:#1a9455;
    --green-bg:#22c55e;
    --green-tint:#e2f3ea;
    --shadow-sm:0 1px 2px rgba(16,25,30,.08);
    --shadow-md:0 10px 30px rgba(12,42,48,.14);
    --r:12px; --r-sm:8px;
    --sans:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --num:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100vh}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer}
  .hide{display:none !important}

  /* ---- TOPBAR (igual ao modelo) ---- */
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--bar);color:#eaf6f5;
    display:flex;align-items:center;gap:14px;padding:0 18px;height:60px;
  }
  .tb-brand{display:flex;align-items:center;gap:11px;min-width:0}
  .tb-brand .mark{width:34px;height:34px;flex:0 0 auto}
  .tb-title{font-family:var(--num);font-weight:600;font-size:15px;line-height:1.15}
  .tb-title small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:#9ccbc7}
  .spacer{flex:1}
  .nav-btn{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
    padding:8px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  }
  .nav-btn.ativo{background:#eaf6f5;color:var(--brand-2);border-color:#eaf6f5}
  .nav-btn:active{transform:scale(.97)}
  .nav-inst{background:var(--green-bg);border-color:var(--green-bg);color:#06281a}
  .nav-inst:active{transform:scale(.97)}
  @media (max-width:430px){
    .tb-title small{display:none}
    .topbar{gap:8px;padding:0 12px}
    .nav-btn{padding:7px 9px;font-size:12px}
  }

  main{max-width:640px;margin:0 auto;padding:22px 16px 56px}

  /* ---- TELA STATUS ---- */
  .hero{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow-sm);padding:26px 20px;text-align:center;position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand)}
  .hero.ok::before{background:var(--green)}
  .hero.off::before{background:var(--red)}
  .selo{
    display:inline-block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    color:var(--brand);background:var(--brand-tint);border-radius:999px;padding:5px 12px;margin-bottom:12px;
  }
  .bot{width:146px;height:146px;margin:2px auto 12px;display:block}
  .estado{font-family:var(--num);font-size:30px;font-weight:700;letter-spacing:.5px;margin:0 0 4px}
  .estado.ok{color:var(--green)} .estado.off{color:var(--red)} .estado.wait{color:var(--ink-3)}
  .maqnome{font-size:13px;color:var(--ink-2);margin-bottom:16px}
  .linha{
    display:flex;justify-content:space-between;gap:10px;font-size:14px;
    padding:12px 2px;border-top:1px solid var(--line);text-align:left;
  }
  .linha .k{color:var(--ink-2)}
  .linha .v{font-family:var(--num);font-weight:600;text-align:right}
  .atualizado{font-size:12px;color:var(--ink-3);text-align:center;margin-top:14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    margin-top:16px;border-radius:var(--r-sm);font-weight:600;font-size:15px;padding:13px 18px;
    transition:all .15s;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  }
  .btn:hover{background:var(--brand-tint);border-color:var(--brand)}
  .btn:active{transform:scale(.99)}

  /* ---- TELA HISTÓRICO ---- */
  .page-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  .page-head h1{margin:0;font-family:var(--num);font-weight:600;font-size:19px}
  .page-head .cont{font-size:12px;color:var(--ink-2)}
  .reg{
    display:flex;align-items:center;gap:12px;position:relative;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    box-shadow:var(--shadow-sm);padding:12px 14px 12px 16px;margin-bottom:8px;font-size:14px;overflow:hidden;
  }
  .reg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
  .reg .pt{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .reg .data{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
  .reg .sit{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
            color:var(--green);background:var(--green-tint);border-radius:999px;padding:4px 10px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .pager button{
    flex:1;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
    border-radius:var(--r-sm);padding:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);
  }
  .pager button:disabled{opacity:.4;box-shadow:none}
  .pager .info{font-size:12px;color:var(--ink-2);white-space:nowrap;font-family:var(--num)}

  .aviso{background:var(--red-tint);border:1px solid #f3c7c1;color:#8f2318;
         border-radius:var(--r-sm);padding:16px;font-size:13px}
  .vazio{color:var(--ink-3);font-size:14px;text-align:center;padding:26px}
  .foot{color:var(--ink-3);font-size:11px;text-align:center;margin-top:24px}
</style>
</head>
<body>

<!-- ======================= CONFIGURAÇÃO (EDITE AQUI) ======================= -->
<script>
  // URL CSV da planilha PUBLICADA NA WEB (Arquivo -> Compartilhar -> Publicar na web
  // -> aba "registros" -> formato CSV). Esta leitura NÃO passa por login do Google,
  // por isso funciona em qualquer navegador/celular.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR12JlZSF-iOSrTq4PFyt-nyTB545uwg1utze9FDA1Yt1pzZ6vAIvmaBqY_7kNzt7mrI_wDNFr3IRc4/pub?gid=0&single=true&output=csv";

  // Minutos sem registro para considerar INATIVO. Use o MESMO valor do monitoramento.gs.
  const LIMITE_INATIVO_MIN = 90;

  // Nome exibido do computador monitorado.
  const MAQUINA = "PC-AUTOMACAO-01";

  // A cada quantos segundos a tela de status se atualiza sozinha.
  const REFRESH_SEG = 60;
</script>
<!-- ======================================================================== -->

<header class="topbar">
  <div class="tb-brand">
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect width="64" height="64" rx="13" fill="#0a3a40"/>
      <g stroke="#7fd4d0" stroke-width="3"><circle cx="24" cy="32" r="12"/><circle cx="44" cy="32" r="8"/></g>
    </svg>
    <div class="tb-title">Monitor do Bot<small>Belt Correias · Automação</small></div>
  </div>
  <div class="spacer"></div>
  <button id="tabStatus" class="nav-btn ativo" onclick="irPara('status')">Status</button>
  <button id="tabHist" class="nav-btn" onclick="irPara('hist')">Histórico</button>
  <button id="btnInstalar" class="nav-btn nav-inst hide" onclick="instalarApp()">⬇ Instalar</button>
</header>

<main>
  <!-- ======================= TELA: STATUS ======================= -->
  <section id="telaStatus">
    <div class="hero" id="hero">
      <span class="selo">Situação do computador</span>
      <svg class="bot" id="botImg" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <div class="estado wait" id="estado">Carregando…</div>
      <div class="maqnome" id="maqnome">—</div>

      <div class="linha"><span class="k">Último registro</span><span class="v" id="ultimo">—</span></div>
      <div class="linha"><span class="k">Há quanto tempo</span><span class="v" id="hatempo">—</span></div>
      <div class="linha"><span class="k">Total de registros</span><span class="v" id="total">—</span></div>

      <button class="btn" onclick="atualizar()">↻ Atualizar agora</button>
      <div class="atualizado" id="atualizado"></div>
    </div>
    <div id="erroStatus"></div>
  </section>

  <!-- ======================= TELA: HISTÓRICO ======================= -->
  <section id="telaHist" class="hide">
    <div class="page-head">
      <h1>Histórico de registros</h1>
      <span class="cont" id="contador"></span>
    </div>
    <div id="listaHist"><div class="vazio">Carregando…</div></div>
    <div class="pager">
      <button id="btnAnt" onclick="mudarPagina(-1)">← Mais recentes</button>
      <span class="info" id="pagInfo">—</span>
      <button id="btnProx" onclick="mudarPagina(1)">Mais antigas →</button>
    </div>
  </section>

  <div class="foot">Painel de consulta · o alerta de queda chega por e-mail</div>
</main>

<script>
const $ = (s)=>document.querySelector(s);
const TAM_PAGINA = 50;
let DADOS = [];        // {registro, situacao, date} em ordem da planilha (antigo -> recente)
let paginaHist = 0, totalPaginas = 1;

function esc(t){ return String(t==null?'':t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

/* ---------- leitura do CSV publicado ---------- */
function parseBR(s){
  const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})\D+(\d{1,2}):(\d{2})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function splitCSV(linha){
  const out=[]; let cur='', dentro=false;
  for(let i=0;i<linha.length;i++){
    const c=linha[i];
    if(c==='"'){ if(dentro && linha[i+1]==='"'){cur+='"';i++;} else dentro=!dentro; }
    else if(c===',' && !dentro){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur);
  return out;
}
function parseCSV(txt){
  const linhas = txt.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  const out=[];
  for(const linha of linhas){
    const cols = splitCSV(linha);
    const a=(cols[0]||'').trim(), b=(cols[1]||'').trim();
    if(!a) continue;
    if(a.toLowerCase()==='registro') continue; // cabeçalho
    out.push({ registro:a, situacao:b||'Ativo', date:parseBR(a) });
  }
  return out;
}
async function buscarDados(){
  const url = CSV_URL + (CSV_URL.indexOf('?')>=0?'&':'?') + '_=' + Date.now(); // evita cache do navegador
  const r = await fetch(url, {redirect:'follow', cache:'no-store'});
  const txt = await r.text();
  if(/^\s*</.test(txt)) throw new Error('a planilha não está publicada como CSV');
  return parseCSV(txt);
}

/* ---------- desenho do bot ---------- */
function desenharBot(estado){
  const cor = estado==='ok' ? '#1a9455' : (estado==='off' ? '#cf3a2c' : '#8a939a');
  const face = '#0c353b';
  const olhos = estado==='off'
    ? `<line x1="40" y1="54" x2="50" y2="64" stroke="${face}" stroke-width="4" stroke-linecap="round"/>
       <line x1="50" y1="54" x2="40" y2="64" stroke="${face}" stroke-width="4" stroke-linecap="round"/>
       <line x1="70" y1="54" x2="80" y2="64" stroke="${face}" stroke-width="4" stroke-linecap="round"/>
       <line x1="80" y1="54" x2="70" y2="64" stroke="${face}" stroke-width="4" stroke-linecap="round"/>`
    : `<circle cx="45" cy="59" r="6" fill="${face}"/><circle cx="75" cy="59" r="6" fill="${face}"/>
       <circle cx="47" cy="57" r="2" fill="#fff"/><circle cx="77" cy="57" r="2" fill="#fff"/>`;
  const boca = estado==='ok'
    ? `<path d="M46 76 Q60 86 74 76" stroke="${face}" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : (estado==='off'
      ? `<path d="M46 82 Q60 74 74 82" stroke="${face}" stroke-width="4" fill="none" stroke-linecap="round"/>`
      : `<line x1="48" y1="79" x2="72" y2="79" stroke="${face}" stroke-width="4" stroke-linecap="round"/>`);
  const zzz = estado==='off'
    ? `<text x="92" y="36" fill="${cor}" font-size="13" font-weight="700" font-family="Space Grotesk,sans-serif">z</text>
       <text x="100" y="26" fill="${cor}" font-size="10" font-weight="700" font-family="Space Grotesk,sans-serif">z</text>`
    : '';
  const antena = `<rect x="57" y="18" width="6" height="12" rx="3" fill="${cor}"/>
                  <circle cx="60" cy="15" r="5" fill="${cor}">${estado==='ok'?'<animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>':''}</circle>`;
  $('#botImg').innerHTML = `
    ${antena}
    <rect x="26" y="34" width="68" height="56" rx="16" fill="${cor}"/>
    <rect x="18" y="52" width="8" height="20" rx="4" fill="${cor}"/>
    <rect x="94" y="52" width="8" height="20" rx="4" fill="${cor}"/>
    ${olhos}${boca}${zzz}
    <rect x="40" y="96" width="14" height="10" rx="3" fill="${cor}"/>
    <rect x="66" y="96" width="14" height="10" rx="3" fill="${cor}"/>`;
}

/* ---------- atualizar (busca + redesenha a tela atual) ---------- */
async function atualizar(){
  $('#atualizado').textContent = 'atualizando…';
  try{
    DADOS = await buscarDados();
    $('#erroStatus').innerHTML = '';
    if(!$('#telaStatus').classList.contains('hide')) renderStatus();
    else renderHist();
  }catch(e){
    desenharBot('wait');
    $('#hero').className = 'hero';
    $('#estado').className = 'estado wait';
    $('#estado').textContent = 'Sem conexão';
    $('#atualizado').textContent = '';
    $('#erroStatus').innerHTML = '<div class="aviso" style="margin-top:12px"><b>Não consegui ler a planilha.</b><br>'
      + 'Confirme que ela está publicada na web em formato CSV. ('+esc(e.message)+')</div>';
  }
}

function renderStatus(){
  const ult = DADOS.length ? DADOS[DADOS.length-1] : null;
  const min = (ult && ult.date) ? Math.round((Date.now()-ult.date)/60000) : null;
  const ativo = (min!=null) && (min <= LIMITE_INATIVO_MIN);

  desenharBot(ativo ? 'ok' : 'off');
  $('#hero').className = 'hero ' + (ativo ? 'ok' : 'off');
  $('#estado').className = 'estado ' + (ativo ? 'ok' : 'off');
  $('#estado').textContent = ativo ? 'ATIVO' : 'INATIVO';
  $('#maqnome').textContent = MAQUINA;
  $('#ultimo').textContent = ult ? ult.registro : 'nenhum registro';
  $('#hatempo').textContent = (min==null) ? '—' : (min<=1 ? 'agora mesmo' : ('há ~'+min+' min'));
  $('#total').textContent = DADOS.length;
  const agora = new Date().toLocaleString('pt-BR');
  $('#atualizado').textContent = 'atualizado ' + agora + ' · inativo após ' + LIMITE_INATIVO_MIN + ' min sem registro';
}

function renderHist(){
  const total = DADOS.length;
  totalPaginas = Math.max(1, Math.ceil(total / TAM_PAGINA));
  if(paginaHist > totalPaginas-1) paginaHist = totalPaginas-1;
  if(paginaHist < 0) paginaHist = 0;

  $('#contador').textContent = total + ' registros';
  const recentes = DADOS.slice().reverse(); // recente -> antigo
  const ini = paginaHist * TAM_PAGINA;
  const pagina = recentes.slice(ini, ini + TAM_PAGINA);

  if(!pagina.length){
    $('#listaHist').innerHTML = '<div class="vazio">Nenhum registro ainda.</div>';
  }else{
    $('#listaHist').innerHTML = pagina.map(x=>
      `<div class="reg"><span class="pt"></span>`+
      `<span class="data">${esc(x.registro)}</span>`+
      `<span class="sit">${esc(x.situacao||'Ativo')}</span></div>`).join('');
  }
  $('#pagInfo').textContent = 'Pág. ' + (paginaHist+1) + ' / ' + totalPaginas;
  $('#btnAnt').disabled = paginaHist<=0;
  $('#btnProx').disabled = paginaHist>=totalPaginas-1;
}

function mudarPagina(delta){
  const nova = paginaHist + delta;
  if(nova<0 || nova>totalPaginas-1) return;
  paginaHist = nova;
  renderHist();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- navegação ---------- */
function irPara(tela){
  const ehStatus = tela==='status';
  $('#telaStatus').classList.toggle('hide', !ehStatus);
  $('#telaHist').classList.toggle('hide', ehStatus);
  $('#tabStatus').classList.toggle('ativo', ehStatus);
  $('#tabHist').classList.toggle('ativo', !ehStatus);
  if(ehStatus){ renderStatus(); }
  else { paginaHist = 0; renderHist(); }
}

/* ---------- início ---------- */
desenharBot('wait');
atualizar();
setInterval(()=>{ if(!$('#telaStatus').classList.contains('hide')) atualizar(); }, REFRESH_SEG*1000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !$('#telaStatus').classList.contains('hide')) atualizar();
});

/* ---------- PWA: registra o service worker (torna o app instalável/offline) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

/* ---------- botão "Instalar aplicativo" ---------- */
let deferredPrompt = null;
const btnInstalar = $('#btnInstalar');
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function ehStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
// Chrome/Android: guarda o evento e mostra o botão quando o app pode ser instalado.
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!ehStandalone()) btnInstalar.classList.remove('hide');
});
// Depois de instalado, o botão some.
window.addEventListener('appinstalled', ()=>{
  deferredPrompt = null;
  btnInstalar.classList.add('hide');
});
async function instalarApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(_){}
    deferredPrompt = null;
    btnInstalar.classList.add('hide');
    return;
  }
  if(iOS){
    alert('Para instalar no iPhone: toque no botão Compartilhar (quadrado com seta) e escolha "Adicionar à Tela de Início".');
  }else{
    alert('Para instalar: abra o menu do navegador (⋮) e toque em "Instalar aplicativo".\n\nSe não aparecer, aguarde alguns segundos na página e recarregue.');
  }
}
// iPhone não dispara o evento automático: mostramos o botão com instruções.
if(iOS && !ehStandalone()) btnInstalar.classList.remove('hide');
</script>
</body>
</html>
